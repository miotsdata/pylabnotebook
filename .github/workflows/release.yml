name: Release

# Push a version tag matching pyproject.toml (eg. `git tag -a 0.4.2 -m ... && git push origin master 0.4.2`) to:
# run the tests, build the wheel + sdist, create the GitHub release (notes from Changelog.md) with them
# attached and, only if all of that passed, publish them to PyPI.
#
# PyPI upload uses Trusted Publishing (no token stored anywhere). One-time setup on pypi.org:
# project pylabnotebook > Settings > Publishing > GitHub publisher with owner miotsdata,
# repository pylabnotebook, workflow release.yml, environment pypi.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v4

      # A PyPI version can never be re-uploaded: refuse a tag that doesn't match pyproject.toml
      - name: Check tag matches version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [[ "$GITHUB_REF_NAME" == "$version" ]] || { echo "Tag $GITHUB_REF_NAME != $version (pyproject.toml)"; exit 1; }

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
          version: "2.28.0"  # the PDM version pdm.lock was made with

      - name: Run the tests
        run: |
          pdm install -G test
          pdm run pytest -q tests

      - name: Build wheel + sdist
        run: pdm build

      - name: Check the wheel has the templates
        run: unzip -l dist/*.whl | grep -q "pylabnotebook/templates/base.html"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's Changelog section, without its heading
          sed -n "/^## \[$GITHUB_REF_NAME\]/,/^## \[/p" Changelog.md | sed '1d;$d' > release_notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release_notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read  # gh release download
      id-token: write  # Trusted Publishing
    steps:
      - name: Download wheel + sdist from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "*.whl" --pattern "*.tar.gz" --dir dist

      - uses: pypa/gh-action-pypi-publish@release/v1
