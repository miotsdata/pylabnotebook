[project]
name = "pylabnotebook"
version = "0.4.0"
description = "This package provides functions to write an automated labnotebook using git."
authors = [
    {name = "Matteo Miotto", email = "miotsdata@gmail.com"},
]
dependencies = [
    "Jinja2>=3.1.4",
    "PyYAML>=6.0",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["git", "notebook", "track", "history", "log"]

[project.urls]
Homepage = "https://github.com/miotsdata/pylabnotebook"
Issues =  "https://github.com/miotsdata/pylabnotebook/issues"

[project.scripts]
labnotebook = "pylabnotebook.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[dependency-groups]
test = [
    "pytest>=9.2.0",
]
